name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - e2e

concurrency:
  # Cancel in-progress runs for the same PR / branch to save CI minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API Tests ─────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (no browsers needed for API tests)
        run: npx playwright install --with-deps chromium
        # Chromium is required even for API project due to Playwright's worker model

      - name: Run API tests
        run: npx playwright test --project=api
        env:
          CI: true
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://automationexercise.com' }}

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 14

  # ─── E2E Tests ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=e2e-chromium
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces / screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
