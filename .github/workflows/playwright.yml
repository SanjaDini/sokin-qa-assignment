name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly run — catches regressions introduced by live-site changes,
  # not just by code changes.
  schedule:
    - cron: '0 6 * * *'
  # Allow manual runs from the GitHub Actions UI with scope selection.
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - e2e

concurrency:
  # Cancel in-progress runs for the same PR / branch to save CI minutes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API Tests ─────────────────────────────────────────────────────────────
  # Runs first. No point starting browsers if the backend contract is broken.
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event.inputs.test_scope == '' ||
      github.event.inputs.test_scope == 'all' ||
      github.event.inputs.test_scope == 'api'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test --project=api
        env:
          CI: true
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://automationexercise.com' }}

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 14

  # ─── E2E Tests ─────────────────────────────────────────────────────────────
  # Only runs when API tests pass. Saves CI time on a broken backend.
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: api-tests
    if: >
      always() &&
      needs.api-tests.result == 'success' &&
      (
        github.event.inputs.test_scope == '' ||
        github.event.inputs.test_scope == 'all' ||
        github.event.inputs.test_scope == 'e2e'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=e2e-chromium
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces / screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
